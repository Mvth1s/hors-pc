[project]
name = "horspc"
version = "0.1.0"
description = "Catalogue des jeux console absents du PC (PS5, Switch, Switch 2, Xbox Series), avec les prix les plus bas en France."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "playwright>=1.48",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horspc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "donnees_generees: lit site/ ou data/ ; relancé par update.yml après le build, avant commit et déploiement",
]
