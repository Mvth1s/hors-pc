name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Installe les dépendances
        run: uv sync --frozen
      - name: Navigateur headless pour les tests de consentement
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
      - name: Syntaxe de site/app.js
        run: node --check site/app.js
