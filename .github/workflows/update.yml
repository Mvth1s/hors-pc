name: Mise à jour

on:
  schedule:
    - cron: "17 6 * * 1" # lundi 06:17 UTC
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Faire échouer le build volontairement pour tester la notification Discord"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "src/**", "data/**"]

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Ancienneté de generated_at (en jours) au-delà de laquelle une issue « Données obsolètes »
  # est ouverte. Distinct de STALE_BANNER_DAYS (14 j) dans site/app.js.
  STALE_ISSUE_DAYS: 8

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Échec volontaire (workflow_dispatch, option test_notification) pour tester le job
      # notify : en tête du job, avant tout build, commit et déploiement.
      - name: Échec volontaire pour tester la notification
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification
        run: |
          echo "::error::Échec volontaire demandé (test_notification) : test du job notify"
          exit 1
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Installe les dépendances
        run: uv sync --frozen
      - name: Navigateur headless pour les tests de consentement
        run: uv run playwright install --with-deps --only-shell chromium
      # Lint et tests avant tout build : s'ils échouent, rien n'est commité ni déployé.
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
      # Les deux builds échouent (code non nul) si la validation échoue : rien n'est
      # commité ni déployé.
      - name: Génère site/data.json (complet, avec IGDB)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        # Relève aussi les prix sur les sources activées (data/sources.config.yaml).
        run: uv run python -m horspc build --scrape-report "$RUNNER_TEMP/scrape-report.json"
      - name: Génère site/data.json (hors ligne, sans commit)
        if: github.event_name == 'push'
        run: uv run python -m horspc build --offline
      - name: Commite le site et les relevés s'ils ont changé
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          generated="site data/discovered.json data/prices.scraped.jsonl"
          if [ -z "$(git status --porcelain -- $generated)" ]; then
            echo "site généré et relevés inchangés"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $generated
          git commit -m "chore(data): mise à jour du catalogue"
          git pull --rebase
          git push
      - name: Vérifie qu'un push ne produit aucun commit
        if: github.event_name == 'push'
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::commit inattendu sur un événement push"
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  freshness:
    # Tourne même si le build échoue (c'est précisément le cas à signaler), mais pas sur
    # push : seul le build planifié ou manuel fait foi pour la fraîcheur.
    needs: build
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Ouvre une issue si generated_at est trop ancien
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          age=$(python3 -c '
          import json, datetime as dt
          g = json.load(open("site/data.json"))["generated_at"]
          print((dt.datetime.now(dt.UTC) - dt.datetime.fromisoformat(g.replace("Z", "+00:00"))).days)
          ')
          echo "data.json généré il y a ${age} jour(s), seuil ${STALE_ISSUE_DAYS}"
          if [ "$age" -le "$STALE_ISSUE_DAYS" ]; then
            exit 0
          fi
          open=$(gh issue list --label stale-data --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "Une issue stale-data est déjà ouverte"
            exit 0
          fi
          gh label create stale-data --color E2AE3F \
            --description "data.json n'est plus mis à jour" --force
          gh issue create --label stale-data --title "Données obsolètes" --body "\
          site/data.json a été généré il y a ${age} jours (seuil : ${STALE_ISSUE_DAYS} jours).

          Pistes : workflow « Mise à jour » en échec (voir ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions), \
          secrets IGDB expirés, ou cron désactivé par GitHub après 60 jours sans activité \
          (Actions > Mise à jour > Enable workflow)."

  notify:
    # Prévient sur Discord si le build planifié ou manuel (ou son déploiement) échoue.
    needs: [build, deploy]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Notification Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Secret DISCORD_WEBHOOK_URL absent : pas de notification"
            exit 0
          fi
          payload=$(jq -n --arg content "❌ HorsPC : le workflow « $WORKFLOW » a échoué (événement : $EVENT). $RUN_URL" \
            '{content: $content, allowed_mentions: {parse: []}}')
          curl --fail --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
