# Enseignes contrôlées par l'audit mensuel (`horspc sources-audit`), reprises de docs/sources.md.
#
# Champs : name, status (retenue | désactivée | exclue), reason (motif court), home (accueil),
#   product (fiche produit connue, facultatif), paths (chemins dont on veut le verdict robots.txt),
#   terms (pages de CGU / CGV dont on suit les clauses), active (source du relevé : JSON-LD vérifié
#   sur `product`, avec le nom du lecteur de prices/sources.py).
# Enseignes qui s'opposent à la fouille : pas de fiche produit, seulement robots.txt, TDMRep,
# l'accueil et leurs conditions (c'est là qu'une levée de l'opposition apparaîtrait).
# L'audit ne modifie jamais data/sources.config.yaml : la décision reste humaine.

leclerc:
  name: E.Leclerc
  status: retenue
  reason: aucune opposition
  active: leclerc
  home: https://www.e.leclerc/
  product: https://www.e.leclerc/fp/mario-kart-world-nintendo-switch-2-0045496312336
  paths: ["/cat/jeux-ps5", "/cat/jeux-switch-2?page=2", "/fp/x-0045496312336", "/recherche?q=x"]
  terms:
    - https://www.e.leclerc/i/conditions-generales-de-vente
