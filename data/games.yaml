# Liste curée des jeux console absents du PC (sortis ou à venir).
# Règle : une entrée = un jeu ; une édition par console, chacune avec ses offres.
#
# Champs :
#   slug                 identifiant kebab-case unique
#   title                titre affiché
#   editions             une édition par console sans version PC :
#                          [{platform: ps5 | switch | switch2 | xbox_series}]
#   igdb_id              optionnel ; sinon recherche IGDB par titre et plateforme
#   launch_price         prix de lancement conseillé en € TTC, ou null
#   launch_price_source  URL de la source (obligatoire si launch_price est renseigné)
#   pc_override          optionnel, prioritaire sur IGDB :
#                          {status: none|announced|released, source_url, checked_at}
#   release_date_override optionnel, prioritaire sur IGDB : {date, source_url}
#   description_fr       optionnel : résumé en français, prioritaire sur le résumé IGDB (anglais)

